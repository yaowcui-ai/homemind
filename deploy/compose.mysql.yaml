name: homemind

services:
  mysql:
    image: ${HOMEMIND_MYSQL_IMAGE:-mysql:8.4}
    labels:
      com.homemind.owner: homemind
      com.homemind.instance: ${HOMEMIND_DATABASE_INSTANCE_ID:?Run scripts/setup_mysql.py}
    environment:
      MYSQL_DATABASE: homemind_app
      MYSQL_USER: homemind_app
      MYSQL_ROOT_PASSWORD: ${HOMEMIND_MYSQL_ROOT_PASSWORD:?Missing local root password}
      MYSQL_PASSWORD: ${HOMEMIND_MYSQL_APP_PASSWORD:?Missing local app password}
      HOMEMIND_MYSQL_TEST_PASSWORD: ${HOMEMIND_MYSQL_TEST_PASSWORD:?Missing local test password}
    ports:
      - "127.0.0.1:13306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-time-zone=+00:00
      - --innodb-buffer-pool-size=64M
      - --max-connections=50
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user=homemind_app --database=homemind_app --execute='SELECT 1' >/dev/null 2>&1
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 40
    restart: "no"

volumes:
  mysql_data:
    name: homemind_mysql_data
    labels:
      com.homemind.owner: homemind
      com.homemind.instance: ${HOMEMIND_DATABASE_INSTANCE_ID:?Run scripts/setup_mysql.py}
