name: HomeMind checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python tools
        run: python -m pip install uv==0.12.5
      - name: Install locked Python dependencies
        working-directory: backend
        run: python -m uv sync --frozen
      - name: Backend checks
        working-directory: backend
        run: |
          python -m uv run --frozen pytest -q
          python -m uv run --frozen ruff check .
          python -m uv run --frozen ruff format --check .
          python -m uv run --frozen python scripts/check_compatibility.py
          python -m uv pip check --python .venv/bin/python
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm test -- --run
          npm run lint
          npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        working-directory: frontend
        run: npm run test:e2e
