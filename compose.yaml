name: homemind

x-app: &app
  image: homemind-api:local
  build:
    context: ./backend
  env_file:
    - ./backend/.env
  environment: &app-environment
    HOMEMIND_ENVIRONMENT: development
    HOMEMIND_API_HOST: 0.0.0.0
    HOMEMIND_API_PORT: "8100"
    HOMEMIND_DATABASE_URL: mysql+asyncmy://homemind_app:${HOMEMIND_MYSQL_APP_PASSWORD:?Run scripts/setup_mysql.py --provision-only}@mysql:3306/homemind_app?charset=utf8mb4
    HOMEMIND_DATABASE_INSTANCE_ID: ${HOMEMIND_DATABASE_INSTANCE_ID:?Run scripts/setup_mysql.py --provision-only}
    HOMEMIND_ALLOWED_ORIGINS: '["http://127.0.0.1:18080","http://localhost:18080"]'

services:
  mysql:
    extends:
      file: ./deploy/compose.mysql.yaml
      service: mysql
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "homemind.migrate", "--initialize-empty"]
    environment:
      <<: *app-environment
      HOMEMIND_MODEL_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    restart: unless-stopped

  web:
    image: homemind-web:local
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/ready"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 12
    restart: unless-stopped

volumes:
  mysql_data:
    name: homemind_mysql_data
    labels:
      com.homemind.owner: homemind
      com.homemind.instance: ${HOMEMIND_DATABASE_INSTANCE_ID:?Run scripts/setup_mysql.py --provision-only}
